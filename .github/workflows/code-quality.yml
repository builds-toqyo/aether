name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # gstreamer-rs 0.25 requires GStreamer >= 1.26; debian:trixie ships 1.26.x
  rust-quality:
    name: Rust Code Quality
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y \
          git curl ca-certificates build-essential pkg-config \
          nasm \
          clang libclang-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libges-1.0-dev \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          librsvg2-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          libxdo-dev \
          libssl-dev

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    # NOTE: -D warnings dropped; ~300 pre-existing clippy warnings need cleanup first
    - name: Run clippy
      run: cargo clippy --workspace

    - name: Check documentation
      run: cargo doc --workspace --no-deps --document-private-items

    - name: Check unused dependencies
      run: |
        cargo install cargo-machete
        cargo machete

    - name: Check for duplicate dependencies
      run: |
        cargo install cargo-dup
        cargo dup

  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint || true

    - name: Run Prettier check
      run: npm run format:check || true

    - name: Type check
      run: npm run type-check || true

    - name: Check for security vulnerabilities
      run: npm audit --audit-level moderate

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y \
          git curl ca-certificates build-essential pkg-config \
          nasm \
          clang libclang-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libges-1.0-dev \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          librsvg2-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          libxdo-dev \
          libssl-dev

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # NOTE: aether_core test/bench targets don't compile yet
    - name: Run benchmarks
      run: |
        cargo bench -p aether_api -p aether_types --all-features || true

    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        tool: 'cargo'
        output-file-path: target/criterion/reports/index.html
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
