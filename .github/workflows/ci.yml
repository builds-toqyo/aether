name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # gstreamer-rs 0.25 requires GStreamer >= 1.26; debian:trixie ships 1.26.x
    container: debian:trixie

    steps:
    # Full Tauri dep set needed: aether_api depends on the tauri crate, so even
    # `cargo test -p aether_api` compiles gtk/gdk/webkit sys crates
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y \
          git curl ca-certificates build-essential pkg-config \
          nasm \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libges-1.0-dev \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          librsvg2-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          libxdo-dev \
          libssl-dev

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    # NOTE: -D warnings dropped; ~300 pre-existing clippy warnings need cleanup first
    - name: Run clippy
      run: cargo clippy --workspace

    # NOTE: aether_core test modules don't compile (pre-existing API drift);
    # cover the crates whose tests build
    - name: Run tests
      run: cargo test -p aether_api -p aether_types --verbose

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint || true

    - name: Run type checking
      run: npm run type-check || true

    - name: Run frontend tests
      run: npm test || true

    - name: Build frontend
      run: npm run build

  # NOTE: Windows MSVC targets need GStreamer/GES MSVC development binaries
  # (not available via choco) — re-enable once a gst-msvc setup step exists.
  # musl target dropped: gstreamer/ges are dynamically linked and unavailable for musl.
  # aarch64-linux dropped: cross-compiling gstreamer dev libs needs multiarch setup.
  build-linux:
    name: Build Test (Linux x86_64)
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y \
          git curl ca-certificates build-essential pkg-config \
          nasm \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libges-1.0-dev \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          librsvg2-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          libxdo-dev \
          file patchelf desktop-file-utils \
          libssl-dev

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install frontend dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build

    - name: Build Tauri app
      run: npx tauri build --target x86_64-unknown-linux-gnu --no-bundle

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aether-linux-x86_64
        path: |
          src-tauri/target/x86_64-unknown-linux-gnu/release/aether*
        retention-days: 30

  # NOTE: x86_64-apple-darwin dropped — macos-latest is arm64 and brew only
  # provides arm64 gstreamer libs; cross-compiling to x86_64 needs x86_64 gst.
  build-macos:
    name: Build Test (macOS arm64)
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install system dependencies
      # nasm for the vendored ffmpeg build; no system ffmpeg needed
      run: |
        brew install nasm gstreamer gst-plugins-base gst-plugins-good

    - name: Install frontend dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build

    - name: Build Tauri app
      run: npx tauri build --target aarch64-apple-darwin --no-bundle

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aether-macos-aarch64
        path: |
          src-tauri/target/aarch64-apple-darwin/release/aether*
        retention-days: 30

  # Windows MSVC uses a prebuilt FFmpeg (gyan full-shared ships headers,
  # .libs, .pc) — the vendored `build` feature is unix-only since it needs
  # autotools. GStreamer comes from the official MSVC installer (includes
  # development headers + GES).
  build-windows:
    name: Build Test (Windows x86_64)
    runs-on: windows-latest

    steps:
    - name: Install GStreamer (MSVC)
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/1.28.7/msvc/gstreamer-1.0-msvc-x86_64-1.28.7.exe" -OutFile gst-installer.exe
        Start-Process .\gst-installer.exe -ArgumentList "/install","/quiet","/norestart" -Wait
        $gst = "C:\gstreamer\1.0\msvc_x86_64"
        if (-not (Test-Path "$gst\lib\pkgconfig\gstreamer-1.0.pc")) { throw "GStreamer install failed" }
        "PKG_CONFIG_PATH=$gst\lib\pkgconfig" >> $env:GITHUB_ENV
        "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst" >> $env:GITHUB_ENV

    - name: Install FFmpeg dev libraries
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" -OutFile ffmpeg.7z
        7z x ffmpeg.7z -oC:\ | Out-Null
        $ffmpeg = Get-ChildItem C:\ -Directory -Filter "ffmpeg-*-full_shared" | Select-Object -First 1
        if (-not $ffmpeg) { throw "FFmpeg extraction failed" }
        "FFMPEG_DIR=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
        "PKG_CONFIG_PATH=$($ffmpeg.FullName)\lib\pkgconfig;$env:PKG_CONFIG_PATH" >> $env:GITHUB_ENV

    - name: Install pkg-config
      run: choco install -y pkgconfiglite

    - name: Point bindgen at libclang
      shell: pwsh
      run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install frontend dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build

    - name: Build Tauri app
      run: npx tauri build --target x86_64-pc-windows-msvc --no-bundle

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aether-windows-x86_64
        path: |
          src-tauri/target/x86_64-pc-windows-msvc/release/aether.exe
        retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Non-blocking: reports unmaintained transitive deps (proc-macro-error,
    # rustls-pemfile, ttf-parser) that can't be removed without upstream changes
    - name: Security audit
      uses: rustsec/audit-check@v1
      continue-on-error: true
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Audit npm packages
      run: npm audit --audit-level moderate || true
