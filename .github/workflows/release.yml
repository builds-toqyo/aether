name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s")
        fi
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Aether ${{ steps.version.outputs.VERSION }}
        body: |
          ## Aether ${{ steps.version.outputs.VERSION }}
          
          Professional Video Editing & Compositing
          
          ### Changes
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ### Downloads
          Choose your platform below:
          
          - **Windows (x64)**: `aether-windows-x64.exe`
          - **Windows (ARM64)**: `aether-windows-arm64.exe`
          - **macOS (Intel)**: `aether-macos-x64`
          - **macOS (Apple Silicon)**: `aether-macos-arm64`
          - **Linux (x64)**: `aether-linux-x64`
          - **Linux (ARM64)**: `aether-linux-arm64`
          
          ### Installation
          
          **Windows**: Download and run the `.exe` file
          **macOS**: Download, make executable, and run
          **Linux**: Download, make executable, and run
          
          ```bash
          chmod +x aether-*
          ./aether-*
          ```
        draft: false
        prerelease: false

  build-and-upload:
    name: Build and Upload
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # NOTE: Windows MSVC needs GStreamer/GES MSVC dev binaries (not on
          # choco); aarch64-linux needs multiarch gst cross-libs; x86_64-apple
          # needs x86 gst libs (brew is arm64-only) — all dropped for now.
          - os: ubuntu-latest
            container: debian:trixie
            target: x86_64-unknown-linux-gnu
            binary_name: aether-linux-x64
            platform: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: aether-macos-arm64
            platform: macos

    # debian:trixie ships GStreamer 1.26.x (required by gstreamer-rs 0.25);
    # evaluates to no container for the macos entry
    container: ${{ matrix.container }}

    steps:
    - name: Install system dependencies (Linux)
      if: matrix.platform == 'linux'
      run: |
        apt-get update
        apt-get install -y \
          git curl ca-certificates build-essential pkg-config \
          nasm \
          clang libclang-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libges-1.0-dev \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          librsvg2-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          libxdo-dev \
          file patchelf desktop-file-utils \
          libssl-dev

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target }}-cargo-

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install system dependencies (macOS)
      if: matrix.platform == 'macos'
      # nasm for the vendored ffmpeg build; no system ffmpeg needed
      run: |
        brew install nasm gstreamer gst-plugins-base gst-plugins-good

    - name: Install frontend dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build

    - name: Build Tauri binary
      run: |
        npx tauri build --target ${{ matrix.target }} --no-bundle

    - name: Rename binary
      run: |
        cd src-tauri/target/${{ matrix.target }}/release/
        mv aether ${{ matrix.binary_name }}

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary_name }}
        asset_name: ${{ matrix.binary_name }}
        asset_content_type: application/octet-stream

  build-docker:
    name: Build Docker Image
    needs: create-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  update-docs:
    name: Update Documentation
    needs: create-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate API documentation
      run: |
        cargo doc --all-features --no-deps --document-private-items

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: target/doc
        destination_dir: api
