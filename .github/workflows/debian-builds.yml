name: Debian Builds

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly to check compatibility with Debian updates
    - cron: '0 2 * * 1'

jobs:
  debian-builds:
    name: Debian-based Builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Debian stable
          - distro: debian
            version: bookworm
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - distro: debian
            version: bookworm
            arch: arm64
            target: aarch64-unknown-linux-gnu
          
          # Debian oldstable
          - distro: debian
            version: bullseye
            arch: amd64
            target: x86_64-unknown-linux-gnu
          
          # Ubuntu LTS
          - distro: ubuntu
            version: jammy
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - distro: ubuntu
            version: jammy
            arch: arm64
            target: aarch64-unknown-linux-gnu
          
          - distro: ubuntu
            version: noble
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - distro: ubuntu
            version: noble
            arch: arm64
            target: aarch64-unknown-linux-gnu
          
          # Mint LTS
          - distro: linuxmint
            version: vanessa
            arch: amd64
            target: x86_64-unknown-linux-gnu
          
          # Pop! OS
          - distro: pop
            version: 22.04
            arch: amd64
            target: x86_64-unknown-linux-gnu

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/amd64,linux/arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.distro }}-${{ matrix.version }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ matrix.distro }}-${{ matrix.version }}-${{ matrix.arch }}-cargo-

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Build Docker image for ${{ matrix.distro }} ${{ matrix.version }}
      run: |
        cat > Dockerfile.${{ matrix.distro }}-${{ matrix.version }} << 'EOF'
        FROM ${{ matrix.distro }}:${{ matrix.version }}
        
        # Install system dependencies
        RUN apt-get update && apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-editing-services1.0-dev \
            libgtk-3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxtst-dev \
            libxi-dev \
            nodejs \
            npm \
            curl \
            git \
            && rm -rf /var/lib/apt/lists/*
        
        # Install Rust
        RUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        ENV PATH="/root/.cargo/bin:${PATH}"
        RUN rustup target add ${{ matrix.target }}
        
        # Install Tauri CLI
        RUN cargo install tauri-cli --version ^2.0
        
        WORKDIR /app
        
        # Copy source code
        COPY . .
        
        # Install frontend dependencies
        RUN npm ci
        
        # Build frontend
        RUN npm run build
        
        # Build Tauri app
        RUN cargo tauri build --target ${{ matrix.target }}
        EOF
        
        docker build -f Dockerfile.${{ matrix.distro }}-${{ matrix.version }} -t aether-${{ matrix.distro }}-${{ matrix.version }} .

    - name: Run build in container
      run: |
        docker run --rm -v $(pwd):/app aether-${{ matrix.distro }}-${{ matrix.version }}

    - name: Create Debian package
      if: matrix.distro == 'debian'
      run: |
        # Create proper Debian package structure
        mkdir -p debian-package/DEBIAN
        mkdir -p debian-package/usr/bin
        mkdir -p debian-package/usr/share/applications
        mkdir -p debian-plugin/usr/share/icons/hicolor/256x256/apps
        
        # Copy built binary
        cp src-tauri/target/${{ matrix.target }}/release/aether debian-package/usr/bin/
        
        # Create control file
        cat > debian-package/DEBIAN/control << EOF
        Package: aether
        Version: 0.1.0
        Section: video
        Priority: optional
        Architecture: ${{ matrix.arch == 'amd64' && 'amd64' || 'arm64' }}
        Depends: libavcodec58 (>= 7:4.4), libavformat58 (>= 7:4.4), libavutil56 (>= 7:4.4), libswscale5 (>= 7:4.4), libgstreamer1.0-0 (>= 1.18.0), libgstreamer-plugins-base1.0-0 (>= 1.18.0), libgtk-3-0 (>= 3.24), libssl1.1 (>= 1.1.1)
        Maintainer: Aether Team <team@aether.video>
        Description: Professional video editing and compositing
         Aether is a professional video editing and compositing application
         designed to compete with DaVinci Resolve and Adobe Fusion.
         Features node-based compositing, real-time GPU preview,
         advanced color grading, and motion graphics.
        EOF
        
        # Create desktop entry
        cat > debian-package/usr/share/applications/aether.desktop << EOF
        [Desktop Entry]
        Name=Aether
        Comment=Professional video editing and compositing
        Exec=/usr/bin/aether
        Icon=aether
        Terminal=false
        Type=Application
        Categories=AudioVideo;Video;
        Keywords=video;edit;compositing;color;grading;
        EOF
        
        # Calculate package size
        du -s debian-package/ | awk '{print $1 * 1024}' > debian-package/DEBIAN/size
        
        # Build package
        dpkg-deb --build debian-package aether_${{ matrix.version }}_${{ matrix.arch }}.deb

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aether-${{ matrix.distro }}-${{ matrix.version }}-${{ matrix.arch }}
        path: |
          src-tauri/target/${{ matrix.target }}/release/bundle/
          aether_${{ matrix.version }}_${{ matrix.arch }}.deb
        retention-days: 30

  compatibility-test:
    name: Compatibility Test
    runs-on: ubuntu-latest
    needs: debian-builds
    strategy:
      matrix:
        include:
          - distro: debian
            version: bookworm
          - distro: ubuntu
            version: jammy
          - distro: ubuntu
            version: noble

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Test in ${{ matrix.distro }} ${{ matrix.version }}
      run: |
        docker run --rm -v $(pwd):/app ${{ matrix.distro }}:${{ matrix.version }} bash -c "
          apt-get update && apt-get install -y \
            libavcodec58 \
            libavformat58 \
            libavutil56 \
            libswscale5 \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgtk-3-0 \
            libssl1.1
          
          # Test if binary would run (basic dependency check)
          echo 'Testing compatibility for ${{ matrix.distro }} ${{ matrix.version }}'
        "
