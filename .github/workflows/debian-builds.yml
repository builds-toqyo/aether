name: Debian Builds

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly to check compatibility with Debian updates
    - cron: '0 2 * * 1'

jobs:
  # NOTE: gstreamer-rs 0.25 requires GStreamer >= 1.26, so the matrix is
  # limited to distros shipping it (debian:trixie 1.26.x, ubuntu:questing 1.26.x).
  # bookworm/bullseye/jammy/noble and derived distros ship GStreamer <= 1.24.
  debian-builds:
    name: Debian-based Builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: debian
            version: trixie
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - distro: debian
            version: trixie
            arch: arm64
            target: aarch64-unknown-linux-gnu

          - distro: ubuntu
            version: questing
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - distro: ubuntu
            version: questing
            arch: arm64
            target: aarch64-unknown-linux-gnu

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/amd64,linux/arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build toolchain image for ${{ matrix.distro }} ${{ matrix.version }}
      run: |
        cat > Dockerfile.${{ matrix.distro }}-${{ matrix.version }} << 'EOF'
        FROM ${{ matrix.distro }}:${{ matrix.version }}

        # Install system dependencies (Tauri 2 + ffmpeg + gstreamer >= 1.26)
        RUN apt-get update && apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            libpostproc-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libges-1.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            file \
            patchelf \
            desktop-file-utils \
            nodejs \
            npm \
            curl \
            ca-certificates \
            git \
            && rm -rf /var/lib/apt/lists/*

        # Install Rust
        RUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        ENV PATH="/root/.cargo/bin:${PATH}"
        RUN rustup target add ${{ matrix.target }}

        WORKDIR /app
        EOF

        docker build --platform linux/${{ matrix.arch }} \
          -f Dockerfile.${{ matrix.distro }}-${{ matrix.version }} \
          -t aether-toolchain-${{ matrix.distro }}-${{ matrix.version }} .

    - name: Build inside container (artifacts land on the mounted workspace)
      run: |
        docker run --rm --platform linux/${{ matrix.arch }} \
          -v $(pwd):/app -w /app \
          aether-toolchain-${{ matrix.distro }}-${{ matrix.version }} \
          bash -c "npm ci && npm run build && npx tauri build --target ${{ matrix.target }}"

    - name: Create Debian package
      if: matrix.distro == 'debian'
      run: |
        # Create proper Debian package structure
        mkdir -p debian-package/DEBIAN
        mkdir -p debian-package/usr/bin
        mkdir -p debian-package/usr/share/applications
        mkdir -p debian-plugin/usr/share/icons/hicolor/256x256/apps

        # Copy built binary
        cp src-tauri/target/${{ matrix.target }}/release/aether debian-package/usr/bin/

        # Create control file
        cat > debian-package/DEBIAN/control << EOF
        Package: aether
        Version: 0.1.0
        Section: video
        Priority: optional
        Architecture: ${{ matrix.arch }}
        Depends: libavcodec61, libavformat61, libavutil59, libswscale8, libswresample5, libavfilter10, libavdevice61, libpostproc58, libgstreamer1.0-0 (>= 1.26.0), libgstreamer-plugins-base1.0-0 (>= 1.26.0), libges-1.0-0 (>= 1.26.0), libwebkit2gtk-4.1-0, libgtk-3-0 (>= 3.24), libssl3
        Maintainer: Aether Team <team@aether.video>
        Description: Professional video editing and compositing
         Aether is a professional video editing and compositing application
         designed to compete with DaVinci Resolve and Adobe Fusion.
         Features node-based compositing, real-time GPU preview,
         advanced color grading, and motion graphics.
        EOF

        # Create desktop entry
        cat > debian-package/usr/share/applications/aether.desktop << EOF
        [Desktop Entry]
        Name=Aether
        Comment=Professional video editing and compositing
        Exec=/usr/bin/aether
        Icon=aether
        Terminal=false
        Type=Application
        Categories=AudioVideo;Video;
        Keywords=video;edit;compositing;color;grading;
        EOF

        # Calculate package size
        du -s debian-package/ | awk '{print $1 * 1024}' > debian-package/DEBIAN/size

        # Build package
        dpkg-deb --build debian-package aether_${{ matrix.version }}_${{ matrix.arch }}.deb

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aether-${{ matrix.distro }}-${{ matrix.version }}-${{ matrix.arch }}
        path: |
          src-tauri/target/${{ matrix.target }}/release/bundle/
          aether_${{ matrix.version }}_${{ matrix.arch }}.deb
        retention-days: 30

  compatibility-test:
    name: Compatibility Test
    runs-on: ubuntu-latest
    needs: debian-builds
    strategy:
      matrix:
        include:
          - distro: debian
            version: trixie
          - distro: ubuntu
            version: questing

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Test in ${{ matrix.distro }} ${{ matrix.version }}
      run: |
        docker run --rm -v $(pwd):/app ${{ matrix.distro }}:${{ matrix.version }} bash -c "
          apt-get update && apt-get install -y \
            libavcodec61 \
            libavformat61 \
            libavutil59 \
            libswscale8 \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libges-1.0-0 \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libssl3

          # Test if binary would run (basic dependency check)
          echo 'Testing compatibility for ${{ matrix.distro }} ${{ matrix.version }}'
        "
