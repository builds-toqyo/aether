[package]
name = "aether_core"
version = "0.1.0"
edition = "2024"

[dependencies]
# FFmpeg dependencies for final rendering
ffmpeg-next = "8.1.0"
ffmpeg-sys-next = "8.1.0"

# GStreamer dependencies for core editing engine
gstreamer = { version = "0.25.1", features = ["v1_18"] }
gstreamer-app = "0.25.0"
gstreamer-audio = "0.25.0"
gstreamer-video = "0.25.0"
gstreamer-editing-services = "0.25.0"
gstreamer-pbutils = "0.25.0"
gstreamer-base = "0.25.0"

# GPU dependencies for compute pipeline
wgpu = "29.0.3"
pollster = "0.4.0"
bytemuck = { version = "1.25.0", features = ["derive"] }

# Common dependencies
anyhow = "1.0.102"
thiserror = "2.0.18"
log = "0.4.29"
parking_lot = "0.12.5"  # For synchronization primitives
once_cell = "1.21.4"    # For lazy initialization
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
num_cpus = "1.17.0"      # For CPU count detection

# Internal dependencies
aether_types = { path = "../aether_types" }

# ACES/OpenColorIO dependencies for professional color pipeline
ocio-sys = "0.3"  # OpenColorIO bindings
ocio = "0.3"      # High-level OpenColorIO wrapper

[dev-dependencies]
env_logger = "0.11.10"   # For test logging
