[package]
name = "aether_core"
version = "0.1.0"
edition = "2024"

[dependencies]
# FFmpeg dependencies for final rendering
ffmpeg-next = "9.0.0"
# `build` compiles vendored FFmpeg from source — immune to system version
# drift. Unix only: vendored build needs autotools, so Windows uses a
# prebuilt FFmpeg via FFMPEG_DIR / pkg-config instead.
[target.'cfg(not(windows))'.dependencies.ffmpeg-sys-next]
version = "9.0.1"
features = ["build"]

[target.'cfg(windows)'.dependencies.ffmpeg-sys-next]
version = "9.0.1"

# GStreamer dependencies for core editing engine
gstreamer = { version = "0.25.4", features = ["v1_18"] }
gstreamer-app = "0.25.2"
gstreamer-audio = "0.25.4"
gstreamer-video = "0.25.4"
gstreamer-editing-services = "0.25.4"
gstreamer-pbutils = "0.25.4"
gstreamer-base = "0.25.4"
glib = "0.22.10"
image = "0.25.10"
chrono = "0.4.45"

# GPU dependencies for compute pipeline
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }

# Common dependencies
anyhow = "1.0.104"
thiserror = "2.0.21"
log = "0.4.34"
parking_lot = "0.12.5"  # For synchronization primitives
once_cell = "1.21.4"    # For lazy initialization
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
num_cpus = "1.17.0"      # For CPU count detection

# Internal dependencies
aether_types = { path = "../aether_types" }

# ACES/OpenColorIO dependencies for professional color pipeline
libloading = "0.9.0"

# Font metrics and text rendering
fontdue = "0.9.4"

[features]
default = []
cuda = []
vaapi = []
videotoolbox = []
amf = []

[dev-dependencies]
env_logger = "0.11.11"   # For test logging
