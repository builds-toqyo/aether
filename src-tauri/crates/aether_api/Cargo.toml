[package]
name = "aether_api"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2.8.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
